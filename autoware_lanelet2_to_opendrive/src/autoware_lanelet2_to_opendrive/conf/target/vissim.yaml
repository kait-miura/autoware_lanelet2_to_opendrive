# PTV Vissim target configuration
# Produces OpenDRIVE 1.4 output adapted to the Vissim openDRIVE importer.
# See docs/vissim-compatibility.md for the full compatibility review.

# Vissim ignores signals entirely, so no junction-based filtering is needed.
exclude_non_junction_signals: false

# Traffic rule defaults to RHT (Japanese maps override with LHT in map config)
# traffic_rule: "RHT"

# OpenDRIVE signal configuration (signals are retained but ignored by Vissim)
signal:
  country: "DE"

# ParamPoly3 segment generation configuration
# Vissim sets spline points at a minimum spacing of 0.5 m, so segments
# shorter than that are avoided (same floor as the CARLA target).
parampoly3:
  enabled: true
  min_segment_length: 0.5  # meters (Vissim minimum spline point spacing)
  default_segment_length: 1.0  # meters
  max_segments: 100
  min_segments: 1
  coefficient_epsilon: 1.0e-8

# Stop line object configuration (objects are ignored by Vissim)
stopline:
  width: 0.1

# Width spline sampling configuration
width_estimation:
  adaptive_sampling: true
  min_samples: 5
  max_samples: 50
  default_sample_interval: 5.0

# Vissim export profile (write-time post-processing; see vissim_profile.py)
vissim:
  enabled: true

  # Strip attributes absent from the OpenDRIVE 1.4 schema that Vissim's
  # import validation would flag: road@rule, lane@rule (CARLA LHT
  # extensions) and access@rule (OpenDRIVE 1.6 syntax).
  strip_nonstandard_attributes: true

  # paramPoly3 parameter convention:
  #   normalized — re-parameterize coefficients to p in [0, 1] exactly and
  #                drop the non-1.4 pRange attribute (schema-clean).
  #   arcLength  — keep the emitted coefficients and pRange attribute.
  # Verify with a one-off Vissim import test which convention its parser
  # assumes (docs/vissim-compatibility.md, "Open items").
  param_poly3_p_range: "normalized"

  # Replace the header geoReference with a PROJ string describing the
  # exported local frame so Vissim places the network correctly on its
  # background map (issue #550).
  local_geo_reference: true

  # Collapse each lane's polynomial <width> records to a single constant
  # (arc-length-weighted mean). Vissim only supports constant lane widths;
  # polynomial records trigger its width-change machinery (a connector plus
  # two 1.1 m links per >= 0.25 m variation), which fragments every road
  # into dozens of links and causes "node overlap on link ... Start"
  # import errors.
  constant_lane_widths: true

  # Merge junctions whose connecting roads terminate at the same road
  # endpoint (chained divergence-synthesis junctions). Vissim builds one
  # node per junction; co-located junctions make the node areas overlap
  # ("Nodes ... overlap on link ..." error, conflict areas undetermined).
  merge_overlapping_junctions: true

  # Lanelet2 maps store ABSOLUTE elevation (the Odaiba clip runs 4.4-12.7 m
  # above sea level) and the converter subtracts nothing unless map.offset.z
  # is set, so the whole network floats above Vissim's background plane — by a
  # varying amount where the terrain rises. Shift it so the lowest road
  # surface sits at z = 0. Only a constant offset is applied, so every
  # gradient is preserved.
  #   min  — lowest road surface at zero (default)
  #   mean — centre the network on zero
  #   none — keep absolute elevation
  #   <number> — shift by that many metres
  elevation_baseline: "min"

  # Merge roads that are the per-lane halves of one carriageway back into a
  # single road. The divergence synthesis can emit each lane as its own road
  # (Odaiba roads 23 and 24 run 3.27 m apart with a 0.03 deg heading
  # difference and share both link ends), and in Vissim that shows up as the
  # road visibly splitting. Only roads agreeing on BOTH link ends are merged,
  # so the merged road inherits them unchanged and no movement has to move.
  merge_parallel_lane_roads: true

  # Autoware tags a turn lane from where its POCKET OPENS, not from where the
  # turn begins, but the converter reads turn_direction as "this lanelet is
  # inside an intersection". A straight pocket therefore becomes a connecting
  # road that starts far upstream and runs alongside the through carriageway
  # (Odaiba: 119 m connectors over the neighbouring roads). Drop the attribute
  # from left/right lanelets that do not actually turn; "straight" is never
  # removed, since inside an intersection that is the correct description.
  untag_straight_turn_lanelets: true

  # Replace the 0.01 m stub connecting roads the divergence synthesis emits
  # with a direct link between their neighbours. In Vissim a 1 cm link is
  # below the 0.5 m minimum spline spacing and traffic through it is
  # unreliable; the stub is 1 cm long, so joining its neighbours directly
  # changes the geometry by at most that centimetre.
  absorb_degenerate_stubs: true

  # Turn junctions that carry no crossing movement into ordinary road links.
  # Vissim places a node — with the whole intersection machinery, including
  # auto-generated conflict areas — at every <junction>, so the divergence
  # synthesis wrapping each lane-level merge/diverge in a junction makes
  # plain widenings and off-ramps arrive as intersections. On the Odaiba
  # clip this reduces 7 junctions to the 1 real intersection.
  dissolve_non_intersection_junctions: true
